name: Build & Publish Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows
            os: windows-latest
            flutter_target: windows
            warp_arch: windows-x64
            warp_bin: windows-x64.warp-packer.exe
            exec_name: quickdoom.exe
            build_dir: build/windows/x64/runner/Release
            output_name: QuickDoom-Windows-Standalone.exe
            zip_name: QuickDoom-Windows-Portable.zip
            use_warp: true

          - target: Linux
            os: ubuntu-latest
            flutter_target: linux
            exec_name: quickdoom
            build_dir: build/linux/x64/release/bundle
            zip_name: QuickDoom-Linux-Portable.tar.gz
            use_warp: false

          - target: macOS
            os: macos-latest
            flutter_target: macos
            exec_name: QuickDoom.app/Contents/MacOS/QuickDoom
            build_dir: build/macos/Build/Products/Release
            zip_name: QuickDoom-macOS-Portable.zip
            use_warp: false

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Linux System Dependencies 
      - name: Install Linux Build Dependencies
        if: matrix.target == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libappindicator3-dev

      # 3. Install UPX Compression Tool (Windows only)
      - name: Install UPX (Windows)
        if: matrix.target == 'Windows'
        run: choco install upx

      # 4. Setup Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. Fetch Flutter Dependencies
      - name: Install Flutter Dependencies
        run: flutter pub get

      # 6. Build Flutter Release with Tree Shaking & Symbol Stripping
      - name: Build Flutter Desktop Release
        run: |
          flutter build ${{ matrix.flutter_target }} --release --split-debug-info=./symbols --obfuscate --tree-shake-icons

      # 7. Clean macOS Debug Symbols (.dSYM)
      - name: Clean macOS Debug Symbols (.dSYM)
        if: matrix.target == 'macOS'
        run: |
          rm -rf ${{ matrix.build_dir }}/*.dSYM

      # 8. Mild UPX Compression Phase (Windows only, skipped for Linux & macOS to prevent crashes)
      - name: Compress Executable with UPX (Windows)
        if: matrix.target == 'Windows'
        shell: pwsh
        run: |
          upx --best ${{ matrix.build_dir }}/${{ matrix.exec_name }} || true

      # 9. Download warp-packer (Windows only)
      - name: Download warp-packer
        if: matrix.use_warp
        shell: bash
        run: |
          curl -Lo warp-packer https://github.com/dgiagio/warp/releases/download/v0.3.0/${{ matrix.warp_bin }}
          chmod +x warp-packer

      # 10. Single-Executable Assembly with warp-packer (Windows only)
      - name: Pack Single Executable with warp-packer
        if: matrix.use_warp
        shell: bash
        run: |
          ./warp-packer \
            --arch ${{ matrix.warp_arch }} \
            --input_dir ${{ matrix.build_dir }} \
            --exec ${{ matrix.exec_name }} \
            --output ${{ matrix.output_name }}

      # 11. Generate Portable Archives (Tarball for Linux, Zip for Windows/macOS)
      - name: Create Portable Zip Archive (Windows)
        if: matrix.target == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.build_dir }}/* -DestinationPath ${{ matrix.zip_name }}

      - name: Create Portable Tarball (Linux - preserves +x permissions)
        if: matrix.target == 'Linux'
        run: |
          tar -czvf ${{ matrix.zip_name }} -C ${{ matrix.build_dir }} .

      - name: Create Portable Zip Archive (macOS)
        if: matrix.target == 'macOS'
        run: |
          (cd ${{ matrix.build_dir }} && zip -r $GITHUB_WORKSPACE/${{ matrix.zip_name }} QuickDoom.app)

      # 12. Publish Assets directly to GitHub Release
      - name: Publish Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.output_name }}
            ${{ matrix.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
