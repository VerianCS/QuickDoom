name: Build & Publish Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows
            os: windows-latest
            flutter_target: windows
            warp_arch: windows-x64
            warp_bin: windows-x64.warp-packer.exe
            exec_name: quickdoom.exe
            build_dir: build/windows/x64/runner/Release
            output_name: QuickDoom-Windows-Standalone.exe
            zip_name: QuickDoom-Windows-Portable.zip

          - target: Linux
            os: ubuntu-latest
            flutter_target: linux
            warp_arch: linux-x64
            warp_bin: linux-x64.warp-packer
            exec_name: quickdoom
            build_dir: build/linux/x64/release/bundle
            output_name: QuickDoom-Linux-Standalone
            zip_name: QuickDoom-Linux-Portable.zip

          - target: macOS
            os: macos-latest
            flutter_target: macos
            warp_arch: macos-x64
            warp_bin: macos-x64.warp-packer
            exec_name: quickdoom.app/Contents/MacOS/quickdoom
            build_dir: build/macos/Build/Products/Release
            output_name: QuickDoom-macOS-Standalone
            zip_name: QuickDoom-macOS-Portable.zip

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Linux System Dependencies (Ubuntu Runner Only)
      - name: Install Linux Build Dependencies
        if: matrix.target == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev upx

      # 3. Install UPX Compression Tool (Windows & macOS Runners)
      - name: Install UPX (Windows)
        if: matrix.target == 'Windows'
        run: choco install upx

      - name: Install UPX (macOS)
        if: matrix.target == 'macOS'
        run: brew install upx

      # 4. Setup Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. Fetch Flutter Dependencies
      - name: Install Flutter Dependencies
        run: flutter pub get

      # 6. Build Flutter Release with Tree Shaking & Symbol Stripping
      - name: Build Flutter Desktop Release
        run: |
          flutter build ${{ matrix.flutter_target }} --release --split-debug-info=./symbols --obfuscate --tree-shake-icons

      # 7. UPX Compression Phase (Compresses DLLs / Dynamic Libraries)
      - name: Compress Binaries with UPX (Windows)
        if: matrix.target == 'Windows'
        shell: pwsh
        run: |
          upx --best --ultra-brute ${{ matrix.build_dir }}/*.dll || true
          upx --best --ultra-brute ${{ matrix.build_dir }}/${{ matrix.exec_name }} || true

      - name: Compress Binaries with UPX (Linux)
        if: matrix.target == 'Linux'
        run: |
          upx --best --ultra-brute ${{ matrix.build_dir }}/lib/*.so || true
          upx --best --ultra-brute ${{ matrix.build_dir }}/${{ matrix.exec_name }} || true

      # Note: UPX is skipped on macOS binaries to avoid Apple Gatekeeper / Mach-O codesign invalidation issues.

      # 8. Download warp-packer Tool
      - name: Download warp-packer
        shell: bash
        run: |
          curl -Lo warp-packer https://github.com/dgiagio/warp/releases/download/v0.3.0/${{ matrix.warp_bin }}
          chmod +x warp-packer

      # 9. Single-Executable Assembly with warp-packer
      - name: Pack Single Executable with warp-packer
        shell: bash
        run: |
          ./warp-packer \
            --arch ${{ matrix.warp_arch }} \
            --input_dir ${{ matrix.build_dir }} \
            --exec ${{ matrix.exec_name }} \
            --output ${{ matrix.output_name }}
          chmod +x ${{ matrix.output_name }} || true

      # 10. Generate Traditional Zip Archives (As a Backup Release Artifact)
      - name: Create Portable Zip Archive (Windows)
        if: matrix.target == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.build_dir }}/* -DestinationPath ${{ matrix.zip_name }}

      - name: Create Portable Zip Archive (Linux/macOS)
        if: matrix.target != 'Windows'
        run: zip -r ${{ matrix.zip_name }} ${{ matrix.build_dir }}/*

      # 11. Publish Artifacts directly to GitHub Release
      - name: Publish Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.output_name }}
            ${{ matrix.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
