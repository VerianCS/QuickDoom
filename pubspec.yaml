name: quickdoom
description: "A cross-platform Doom source port launcher with profile management and drag-and-drop mod ordering"
publish_to: 'none'
version: 0.5.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  window_manager: ^0.4.3
  system_tray: ^0.1.1
  desktop_drop: ^0.5.0
  file_picker: ^8.1.4
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.4.2
  http: ^1.2.2
  archive: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico

  # Doom 2016 display family, used for the boot splash wordmark.
  # Freeware / non-commercial - see assets/fonts/LICENSE.txt.
  # Left and Right are the mirrored bevel cuts the logo lockup is built from;
  # Text is the upright face used for smaller copy.
  fonts:
    - family: Doom2016Text
      fonts:
        - asset: assets/fonts/Doom2016Text.ttf
    - family: Doom2016Left
      fonts:
        - asset: assets/fonts/Doom2016Left.ttf
    - family: Doom2016Right
      fonts:
        - asset: assets/fonts/Doom2016Right.ttf
